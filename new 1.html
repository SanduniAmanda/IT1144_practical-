<!DOCTYPE html>
<html>
<head>
	<title>Navigation</title>
	<style> 
	nav{
			background-color:pink;
			padding:10px;
		ul{
			list-style:none;
			padding:5px;
			margin:5px;
			}
		a{
			text-decoration:none;
			
			}
		li{
			display:inline;
			margin-right:20px;
			font-size:25px;
			font-family:arial;
			}
		a:hover{
			color:#f7c948;
			}
	</style>
</head>
<body>
	<h1>My Website</h1>
	<nav>
	<ul>
		<li><a href="#">Home</a></li>
		<li><a href="#">About</a></li>
		<li><a href="#">Services</a></li>
		<li><a href="#">Contact</a></li>
	</ul>
	</nav>
</body>
</html>
