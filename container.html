<!DOCTYPE html>
<html>
<head>
<title>container</title>
<style>
*{box-sizing:border-box;}
.container{
	background-color:green;border:5px solid red;padding:15px;display:flex;justify-content:flex-start;}
.item{
	background-color:yellow;padding:10px 25px;border:2px solid blue;margin:5px;}
</style>
</head>
<body>
<div class="container">
<div class="item">Item1</div>
<div class="item">Item2</div>
<div class="item">Item3</div>
</div>
</body>
</html>
