        <h2 style="color: #3D0C4E; font-family: serif;">Contact Us</h2>
        <p>Have any questions regarding our sarees or want to place an order? Drop us a message below, and our team will get back to you shortly!</p>
        
        <form id="contactForm" class="simple-form">
		<input type="text" id="userName" class="box-input" placeholder="Your Name" required>
		<input type="email" id="userEmail" class="box-input" placeholder="Your Email Address" required>
		<textarea id="userMessage" class="box-input" rows="5" placeholder="Write your message here..." required></textarea>
		<button type="submit" class="btn-send">SEND MESSAGE</button>
</form>
